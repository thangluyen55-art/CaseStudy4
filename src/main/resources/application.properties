# ===== Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/digishop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# ===== Nạp data.sql sau khi Hibernate tạo bảng =====
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Thư mục chứa ảnh thẻ (dấu / ở cuối là bắt buộc) =====
app.card-image-dir=D:/Image/digimon/

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB