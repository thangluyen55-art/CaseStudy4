<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanh toán - DigiShop TCG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container mb-5">
    <h3 class="fw-bold text-info mb-4">Thanh Toán Đơn Hàng</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="row g-4">
        <div class="col-lg-7">
            <form th:action="@{/checkout}" th:object="${form}" method="post" class="card p-4">
                <h5 class="fw-bold text-light mb-3">Thông Tin Giao Hàng</h5>
                <div class="mb-3">
                    <label class="form-label">Người nhận</label>
                    <input type="text" th:field="*{receiverName}" class="form-control"
                           th:classappend="${#fields.hasErrors('receiverName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{receiverName}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Địa chỉ giao hàng</label>
                    <textarea th:field="*{address}" rows="3" class="form-control"
                              th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{address}"></div>
                </div>

                <h5 class="fw-bold text-light my-3">Mã Giảm Giá</h5>
                <div class="input-group mb-1">
                    <input type="text" th:field="*{couponCode}" id="couponCode" class="form-control" placeholder="Mã giảm giá (nếu có)">
                    <button type="button" class="btn btn-outline-info" id="applyCoupon">Áp dụng</button>
                </div>
                <div class="small mb-3" id="couponMsg"></div>

                <h5 class="fw-bold text-light mb-3">Phương Thức Thanh Toán</h5>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="COD" id="pm1">
                    <label class="form-check-label text-light" for="pm1">Thanh toán khi nhận hàng (COD)</label>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="BANK_TRANSFER" id="pm2">
                    <label class="form-check-label text-light" for="pm2">Chuyển khoản ngân hàng</label>
                </div>

                <button type="submit" class="btn btn-digi py-2">Xác Nhận Đặt Hàng</button>
            </form>
        </div>

        <div class="col-lg-5">
            <div class="card p-4">
                <h5 class="fw-bold text-info mb-3">Chi Tiết Đơn Hàng</h5>
                <ul class="list-group list-group-flush mb-3">
                    <li class="list-group-item d-flex justify-content-between px-0" th:each="item : ${cart.items}">
                        <div>
                            <span class="fw-bold text-light" th:text="${item.product.displayName}"></span>
                            <span class="text-muted" th:text="'x' + ${item.quantity}"></span>
                        </div>
                        <span class="text-info" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                    </li>
                </ul>
                <div class="d-flex justify-content-between my-2">
                    <span class="text-muted">Tạm tính</span>
                    <span th:text="${#numbers.formatDecimal(cart.total, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                </div>
                <div class="d-flex justify-content-between my-2">
                    <span class="text-muted">Phí vận chuyển</span>
                    <span th:text="${#numbers.formatDecimal(shippingFee, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                </div>
                <div class="d-flex justify-content-between text-success my-2 d-none" id="discountRow">
                    <span>Giảm giá</span>
                    <span id="discountValue"></span>
                </div>
                <hr class="border-secondary">
                <div class="d-flex justify-content-between fs-5 fw-bold">
                    <span>Tổng thanh toán</span>
                    <span class="price-text" id="totalAmount"
                          th:data-base="${cart.total.add(shippingFee)}"
                          th:text="${#numbers.formatDecimal(cart.total.add(shippingFee), 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const fmt = n => Number(n).toLocaleString('en-US') + ' đ';
    document.getElementById('applyCoupon').addEventListener('click', async () => {
        const code = document.getElementById('couponCode').value.trim();
        const msg = document.getElementById('couponMsg');
        const row = document.getElementById('discountRow');
        const total = document.getElementById('totalAmount');
        const reset = () => { row.classList.add('d-none'); total.textContent = fmt(total.dataset.base); };

        if (!code) { msg.textContent = ''; reset(); return; }
        try {
            const res = await fetch('/checkout/coupon-preview?code=' + encodeURIComponent(code));
            const data = await res.json();
            msg.className = 'small mb-3 ' + (data.valid ? 'text-success' : 'text-danger');
            msg.textContent = data.message;
            if (data.valid) {
                document.getElementById('discountValue').textContent = '- ' + fmt(data.discount);
                row.classList.remove('d-none');
                total.textContent = fmt(data.total);
            } else { reset(); }
        } catch (e) {
            msg.className = 'small mb-3 text-danger';
            msg.textContent = 'Lỗi kết nối kiểm tra mã';
        }
    });
</script>
</body>
</html>
