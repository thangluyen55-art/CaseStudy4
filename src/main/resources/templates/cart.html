<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giỏ hàng - DigiShop TCG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>.item-img { width: 56px; aspect-ratio: 5 / 7; object-fit: contain; background: #070c18; }</style>
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container mb-5">
    <h3 class="fw-bold text-info mb-4">Giỏ Hàng Của Bạn</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="alert alert-dark border-secondary text-center py-4" th:if="${cart.items.isEmpty()}">
        Giỏ hàng hiện đang trống. <a th:href="@{/cards}" class="text-info">Khám phá thẻ bài ngay</a>
    </div>

    <div class="row g-4" th:unless="${cart.items.isEmpty()}">
        <div class="col-lg-8">
            <div class="card p-3">
                <div class="table-responsive">
                    <table class="table table-dark align-middle mb-0">
                        <thead>
                        <tr class="table-light">
                            <th>Sản phẩm</th>
                            <th class="text-end">Đơn giá</th>
                            <th>Số lượng</th>
                            <th class="text-end">Thành tiền</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${cart.items}">
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <img th:src="${item.product.image != null} ? ${item.product.image} : '/images/no-image.svg'"
                                         onerror="this.onerror=null; this.src='/images/no-image.svg'"
                                         class="item-img rounded" th:alt="${item.product.displayName}">
                                    <div>
                                        <a th:href="@{/products/{id}(id=${item.product.id})}"
                                           th:text="${item.product.displayName}" class="text-decoration-none text-light fw-bold"></a>
                                        <div class="small text-muted" th:if="${item.product.cardCondition != null}"
                                             th:text="'Tình trạng: ' + ${item.product.cardCondition}"></div>
                                    </div>
                                </div>
                            </td>
                            <td class="text-end"
                                th:text="${#numbers.formatDecimal(item.product.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                            <td style="width: 160px;">
                                <form th:action="@{/cart/update}" method="post" class="d-flex gap-1">
                                    <input type="hidden" name="itemId" th:value="${item.id}">
                                    <input type="number" name="quantity" class="form-control form-control-sm"
                                           min="0" th:max="${item.product.stock}" th:value="${item.quantity}"
                                           th:attr="aria-label=|Số lượng ${item.product.displayName}|">
                                    <button class="btn btn-sm btn-outline-info">Lưu</button>
                                </form>
                            </td>
                            <td class="text-end text-info fw-bold"
                                th:text="${#numbers.formatDecimal(item.subtotal, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                            <td>
                                <form th:action="@{/cart/remove}" method="post">
                                    <input type="hidden" name="itemId" th:value="${item.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa sản phẩm" aria-label="Xóa sản phẩm">&times;</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <a th:href="@{/cards}" class="btn btn-outline-secondary btn-sm mt-3">&larr; Tiếp tục mua sắm</a>
        </div>

        <div class="col-lg-4">
            <div class="card p-4">
                <h5 class="fw-bold text-info mb-3">Tóm Tắt Đơn Hàng</h5>
                <div class="d-flex justify-content-between my-2">
                    <span class="text-muted">Tổng số lượng:</span>
                    <strong th:text="${cart.totalQuantity} + ' sản phẩm'"></strong>
                </div>
                <div class="d-flex justify-content-between my-2">
                    <span class="text-muted">Tạm tính:</span>
                    <strong class="price-text" th:text="${#numbers.formatDecimal(cart.total, 0, 'POINT', 0, 'COMMA')} + ' đ'"></strong>
                </div>
                <small class="text-muted d-block my-2">Phí vận chuyển sẽ được tính ở bước thanh toán.</small>
                <a th:href="@{/checkout}" class="btn btn-digi w-100 mt-3 py-2">Tiến Hành Thanh Toán</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/layout :: siteFooter}"></div>
</body>
</html>
