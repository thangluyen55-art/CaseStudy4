<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/cards}">DigiShop</a>
        <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                <a class="nav-link" th:href="@{/cart}">Giỏ hàng</a></li>
            <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                <a class="nav-link" th:href="@{/orders}">Đơn hàng</a></li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
                <a class="nav-link" th:href="@{/login}">Đăng nhập</a></li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
                <a class="nav-link" th:href="@{/register}">Đăng ký</a></li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">
                        Đăng xuất (<span sec:authentication="name"></span>)
                    </button>
                </form>
            </li>
            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                <a class="nav-link" th:href="@{/admin}">Quản trị</a></li>
        </ul>
    </div>
</nav>

<th:block th:fragment="alerts">
    <div class="alert alert-success" th:if="${message != null}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
</th:block>

</body>
</html>
