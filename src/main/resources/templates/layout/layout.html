<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand fs-4" th:href="@{/cards}">DIGISHOP TCG</a>
        <div class="d-flex align-items-center gap-3">
            <ul class="navbar-nav ms-auto align-items-center flex-row gap-3">
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link text-light fw-medium" th:href="@{/cart}">🛒 Giỏ hàng</a></li>
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link text-light fw-medium" th:href="@{/wishlist}">♥ Yêu thích</a></li>
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link text-light fw-medium" th:href="@{/decks}">🎴 Bộ bài</a></li>
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link text-light fw-medium" th:href="@{/orders}">📦 Đơn hàng</a></li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link btn btn-sm btn-outline-info text-light px-3" th:href="@{/login}">Đăng nhập</a></li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link btn btn-sm btn-digi text-light px-3" th:href="@{/register}">Đăng ký</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link text-muted p-0">
                            Thoát (<span sec:authentication="name"></span>)
                        </button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link btn btn-sm btn-warning text-dark font-weight-bold px-3" th:href="@{/admin}">Quản trị</a></li>
            </ul>
        </div>
    </div>
</nav>

<th:block th:fragment="alerts">
    <div class="alert alert-success border-0 bg-success text-white mb-4" th:if="${message != null}" th:text="${message}"></div>
    <div class="alert alert-danger border-0 bg-danger text-white mb-4" th:if="${error != null}" th:text="${error}"></div>
</th:block>

</body>
</html>
