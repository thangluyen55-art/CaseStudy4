<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="adminNav" class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand fs-4" th:href="@{/admin}">DIGISHOP ADMIN</a>
        <ul class="navbar-nav me-auto flex-row gap-3">
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link text-light" th:href="@{/admin/dashboard}">📊 Thống kê</a></li>
            <li class="nav-item"><a class="nav-link text-light" th:href="@{/admin/orders}">📦 Đơn hàng</a></li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link text-light" th:href="@{/admin/products}">🃏 Sản phẩm</a></li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link text-light" th:href="@{/admin/coupons}">🏷️ Mã giảm giá</a></li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-center flex-row gap-3">
            <li class="nav-item"><a class="nav-link btn btn-sm btn-outline-info text-light px-3" th:href="@{/cards}">Xem Cửa Hàng</a></li>
            <li class="nav-item">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link text-muted p-0">
                        Đăng xuất (<span sec:authentication="name"></span>)
                    </button>
                </form>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
