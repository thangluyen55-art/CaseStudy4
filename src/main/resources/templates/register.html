<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - DigiShop TCG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center py-5">
<div class="container" style="max-width: 460px;">
    <h3 class="text-center fw-bold mb-4">
        <a th:href="@{/cards}" class="navbar-brand fs-2">DIGISHOP TCG</a>
    </h3>

    <div class="card p-4 shadow-lg">
        <h5 class="fw-bold text-info mb-3">Đăng Ký Tài Khoản</h5>

        <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label" for="fullName">Họ và tên</label>
                <input type="text" th:field="*{fullName}" class="form-control"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{fullName}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="phone">Số điện thoại</label>
                <input type="text" th:field="*{phone}" class="form-control"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{phone}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Mật khẩu</label>
                <input type="password" th:field="*{password}" class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Nhập lại mật khẩu</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
            </div>
            <button type="submit" class="btn btn-digi w-100 py-2 mt-2">Đăng Ký</button>
        </form>
        <p class="text-center text-muted mt-3 mb-0 small">Đã có tài khoản? <a th:href="@{/login}" class="text-info">Đăng nhập</a></p>
    </div>
</div>
</body>
</html>
