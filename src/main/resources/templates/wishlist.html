<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yêu thích - DigiShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.product-img { aspect-ratio: 5 / 7; object-fit: contain; background: #f8f9fa; }</style>
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container mb-5">
    <h3 class="mb-3">Sản phẩm yêu thích</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="alert alert-info" th:if="${items.isEmpty()}">
        Chưa có sản phẩm nào. <a th:href="@{/cards}">Xem cửa hàng</a>
    </div>

    <div class="row row-cols-2 row-cols-md-4 g-3">
        <div class="col" th:each="w : ${items}">
            <div class="card h-100">
                <a th:href="@{/products/{id}(id=${w.product.id})}">
                    <img th:src="${w.product.image != null} ? ${w.product.image} : '/images/no-image.svg'"
                         onerror="this.onerror=null; this.src='/images/no-image.svg'"
                         class="card-img-top product-img" th:alt="${w.product.displayName}">
                </a>
                <div class="card-body d-flex flex-column">
                    <h6 th:text="${w.product.displayName}"></h6>
                    <span class="badge bg-info text-dark align-self-start" th:if="${w.product.cardCondition != null}"
                          th:text="${w.product.cardCondition}"></span>
                    <p class="fw-bold mb-0 mt-2"
                       th:text="${#numbers.formatDecimal(w.product.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></p>
                    <small th:class="${w.product.stock > 0} ? 'text-success' : 'text-danger'"
                           th:text="${w.product.stock > 0} ? 'Còn ' + ${w.product.stock} : 'Hết hàng'"></small>
                    <a th:href="@{/products/{id}(id=${w.product.id})}" class="btn btn-sm btn-outline-primary mt-auto">Xem</a>
                    <form th:action="@{/wishlist/toggle}" method="post" class="mt-1">
                        <input type="hidden" name="productId" th:value="${w.product.id}">
                        <button class="btn btn-sm btn-outline-danger w-100">Bỏ yêu thích</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
