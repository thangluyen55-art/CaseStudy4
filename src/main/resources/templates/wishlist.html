<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yêu thích - DigiShop TCG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container mb-5">
    <h3 class="fw-bold text-info mb-4">Sản Phẩm Yêu Thích</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="alert alert-dark border-secondary text-center py-4" th:if="${items.isEmpty()}">
        Bạn chưa thêm sản phẩm nào vào danh sách yêu thích.
    </div>

    <div class="row row-cols-2 row-cols-md-4 g-3">
        <div class="col" th:each="w : ${items}">
            <div class="tcg-card h-100 d-flex flex-column">
                <div class="tcg-img-wrapper">
                    <a th:href="@{/products/{id}(id=${w.product.id})}">
                        <img th:src="${w.product.image != null} ? ${w.product.image} : '/images/no-image.svg'"
                             onerror="this.onerror=null; this.src='/images/no-image.svg'"
                             class="tcg-card-img" th:alt="${w.product.displayName}">
                    </a>
                </div>
                <div class="p-3 d-flex flex-column flex-grow-1">
                    <h6 class="fw-bold text-light text-truncate" th:text="${w.product.displayName}"></h6>
                    <p class="price-text mb-2"
                       th:text="${#numbers.formatDecimal(w.product.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></p>
                    <a th:href="@{/products/{id}(id=${w.product.id})}" class="btn btn-sm btn-outline-info mb-2">Xem chi tiết</a>
                    <form th:action="@{/wishlist/toggle}" method="post">
                        <input type="hidden" name="productId" th:value="${w.product.id}">
                        <button class="btn btn-sm btn-outline-danger w-100">Bỏ Yêu Thích</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/layout :: siteFooter}"></div>
</body>
</html>
