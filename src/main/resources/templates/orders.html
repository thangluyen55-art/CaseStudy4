<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đơn hàng của tôi - DigiShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container mb-5">
    <h3 class="mb-3">Đơn hàng của tôi</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="alert alert-info" th:if="${orders.isEmpty()}">
        Bạn chưa có đơn hàng nào. <a th:href="@{/cards}">Mua sắm ngay</a>
    </div>

    <div class="card" th:unless="${orders.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>Mã đơn</th><th>Ngày đặt</th><th class="text-end">Tổng tiền</th><th>Trạng thái</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="'#' + ${o.id}"></td>
                    <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                    <td th:switch="${o.status.name()}">
                        <span th:case="'PENDING'" class="badge bg-warning text-dark">Chờ xác nhận</span>
                        <span th:case="'CONFIRMED'" class="badge bg-info text-dark">Đã xác nhận</span>
                        <span th:case="'PACKING'" class="badge bg-primary">Đang đóng gói</span>
                        <span th:case="'SHIPPING'" class="badge bg-primary">Đang giao</span>
                        <span th:case="'COMPLETED'" class="badge bg-success">Hoàn tất</span>
                        <span th:case="'CANCELLED'" class="badge bg-danger">Đã hủy</span>
                    </td>
                    <td><a th:href="@{/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary">Xem</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
