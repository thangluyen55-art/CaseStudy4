<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigiShop - Digimon Card Game</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Style CSS tùy chỉnh -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container py-3">
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="row g-4">
        <!-- Sidebar bộ lọc (Filter Panel) -->
        <aside class="col-lg-3">
            <form method="get" th:action="@{/cards}" class="filter-card p-3">
                <h5 class="fw-bold mb-3 text-info text-uppercase" style="letter-spacing: 1px;">
                    <i class="bi bi-funnel"></i> Bộ Lọc Tìm Kiếm
                </h5>

                <div class="mb-3">
                    <label class="form-label">Tên hoặc Mã thẻ</label>
                    <input type="text" name="keyword" class="form-control"
                           th:value="${filter.keyword}" placeholder="Ví dụ: Agumon, BT1-009...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Loại hàng</label>
                    <select name="productType" class="form-select">
                        <option value="">-- Tất cả --</option>
                        <option th:each="t : ${productTypes}" th:value="${t}" th:text="${t}"
                                th:selected="${t == filter.productType}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Bộ thẻ (Set)</label>
                    <select name="setId" class="form-select">
                        <option value="">-- Tất cả --</option>
                        <option th:each="s : ${sets}" th:value="${s.id}"
                                th:text="${s.code + ' - ' + s.name}"
                                th:selected="${s.id == filter.setId}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Màu sắc</label>
                    <select name="color" class="form-select">
                        <option value="">-- Tất cả màu --</option>
                        <option th:each="c : ${colors}" th:value="${c}" th:text="${c}"
                                th:selected="${c == filter.color}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Độ hiếm (Rarity)</label>
                    <select name="rarity" class="form-select">
                        <option value="">-- Tất cả độ hiếm --</option>
                        <option th:each="r : ${rarities}" th:value="${r}" th:text="${r}"
                                th:selected="${r == filter.rarity}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tình trạng thẻ</label>
                    <select name="cardCondition" class="form-select">
                        <option value="">-- Tất cả tình trạng --</option>
                        <option th:each="c : ${conditions}" th:value="${c}" th:text="${c}"
                                th:selected="${c == filter.cardCondition}"></option>
                    </select>
                </div>

                <div class="row g-2 mb-3">
                    <label class="form-label">Khoảng giá (VNĐ)</label>
                    <div class="col-6">
                        <input type="number" name="minPrice" class="form-control" placeholder="Tối thiểu" th:value="${filter.minPrice}">
                    </div>
                    <div class="col-6">
                        <input type="number" name="maxPrice" class="form-control" placeholder="Tối đa" th:value="${filter.maxPrice}">
                    </div>
                </div>

                <button class="btn btn-digi w-100 py-2 mb-2">Áp Dụng Bộ Lọc</button>
                <a th:href="@{/cards}" class="btn btn-outline-secondary w-100 btn-sm">Xóa lọc</a>
            </form>
        </aside>

        <!-- Danh sách thẻ bài (Main Grid) -->
        <main class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted" th:text="'Tìm thấy ' + ${page.totalElements} + ' thẻ bài'"></span>
            </div>

            <div class="alert alert-dark border-secondary text-center py-4" th:if="${page.empty}">
                Không tìm thấy thẻ bài phù hợp với bộ lọc.
            </div>

            <div class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-3">
                <div class="col" th:each="p : ${page.content}">
                    <div class="tcg-card h-100 d-flex flex-column">
                        <!-- Hình ảnh thẻ bài -->
                        <div class="tcg-img-wrapper">
                            <a th:href="@{/products/{id}(id=${p.id})}" class="w-100 text-center">
                                <img th:src="${p.image != null} ? ${p.image} : '/images/no-image.svg'"
                                     onerror="this.onerror=null; this.src='/images/no-image.svg'"
                                     class="tcg-card-img" th:alt="${p.displayName}" loading="lazy">
                            </a>
                        </div>

                        <!-- Nội dung thẻ -->
                        <div class="p-3 d-flex flex-column flex-grow-1">
                            <h6 class="fw-bold mb-1 text-truncate">
                                <a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.displayName}"
                                   class="text-decoration-none text-light" th:title="${p.displayName}"></a>
                            </h6>

                            <!-- Badges thông tin -->
                            <div class="d-flex flex-wrap gap-1 mb-2">
                                <span class="badge bg-secondary" th:text="${p.productType}"></span>
                                <span class="badge bg-info text-dark" th:if="${p.cardCondition != null}" th:text="${p.cardCondition}"></span>
                                <span th:if="${p.card != null and p.card.color != null}"
                                      th:class="'badge badge-color-' + ${p.card.color}"
                                      th:text="${p.card.color}"></span>
                            </div>

                            <!-- Giá tiền & Tồn kho -->
                            <div class="mt-auto pt-2">
                                <div class="d-flex justify-content-between align-items-baseline mb-2">
                                    <span class="price-text"
                                          th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                                    <small th:class="${p.stock > 0} ? 'text-success' : 'text-danger'"
                                           th:text="${p.stock > 0} ? 'Kho: ' + ${p.stock} : 'Hết hàng'"></small>
                                </div>

                                <!-- Nút bấm hành động -->
                                <button th:if="${p.stock <= 0}" class="btn btn-sm btn-outline-secondary w-100" disabled>Hết hàng</button>

                                <form th:if="${p.stock > 0}" sec:authorize="hasRole('CUSTOMER')"
                                      th:action="@{/cart/add}" method="post">
                                    <input type="hidden" name="productId" th:value="${p.id}">
                                    <input type="hidden" name="quantity" value="1">
                                    <button type="submit" class="btn btn-sm btn-digi w-100">
                                        + Thêm Giỏ Hàng
                                    </button>
                                </form>

                                <a th:if="${p.stock > 0}" sec:authorize="!isAuthenticated()" th:href="@{/login}"
                                   class="btn btn-sm btn-outline-info w-100">Đăng nhập để mua</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Phân trang (Pagination) -->
            <nav class="mt-4" th:if="${page.totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                        th:classappend="${i == page.number} ? 'active'">
                        <a class="page-link bg-dark text-light border-secondary"
                           th:href="@{/cards(page=${i}, keyword=${filter.keyword}, productType=${filter.productType},
                                     setId=${filter.setId}, color=${filter.color}, cardType=${filter.cardType},
                                     rarity=${filter.rarity}, cardCondition=${filter.cardCondition},
                                     minPrice=${filter.minPrice}, maxPrice=${filter.maxPrice})}"
                           th:text="${i + 1}"></a>
                    </li>
                </ul>
            </nav>
        </main>
    </div>
</div>

<!-- Chèn dòng này ngay TRƯỚC thẻ </body> -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
