<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigiShop - Digimon Card Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-img { aspect-ratio: 5 / 7; object-fit: contain; background: #f8f9fa; }
        .product-card:hover { box-shadow: 0 .5rem 1rem rgba(0,0,0,.15); }
    </style>
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container">
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="row">
        <!-- Bộ lọc -->
        <aside class="col-md-3 mb-4">
            <form method="get" th:action="@{/cards}" class="card card-body">
                <div class="mb-2">
                    <label class="form-label">Tìm kiếm</label>
                    <input type="text" name="keyword" class="form-control"
                           th:value="${filter.keyword}" placeholder="Tên hoặc mã thẻ">
                </div>
                <div class="mb-2">
                    <label class="form-label">Loại hàng</label>
                    <select name="productType" class="form-select">
                        <option value="">Tất cả</option>
                        <option th:each="t : ${productTypes}" th:value="${t}" th:text="${t}"
                                th:selected="${t == filter.productType}"></option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Set</label>
                    <select name="setId" class="form-select">
                        <option value="">Tất cả</option>
                        <option th:each="s : ${sets}" th:value="${s.id}"
                                th:text="${s.code + ' - ' + s.name}"
                                th:selected="${s.id == filter.setId}"></option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Màu</label>
                    <select name="color" class="form-select">
                        <option value="">Tất cả</option>
                        <option th:each="c : ${colors}" th:value="${c}" th:text="${c}"
                                th:selected="${c == filter.color}"></option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Độ hiếm</label>
                    <select name="rarity" class="form-select">
                        <option value="">Tất cả</option>
                        <option th:each="r : ${rarities}" th:value="${r}" th:text="${r}"
                                th:selected="${r == filter.rarity}"></option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Tình trạng</label>
                    <select name="cardCondition" class="form-select">
                        <option value="">Tất cả</option>
                        <option th:each="c : ${conditions}" th:value="${c}" th:text="${c}"
                                th:selected="${c == filter.cardCondition}"></option>
                    </select>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col"><input type="number" name="minPrice" class="form-control"
                                            placeholder="Giá từ" th:value="${filter.minPrice}"></div>
                    <div class="col"><input type="number" name="maxPrice" class="form-control"
                                            placeholder="Đến" th:value="${filter.maxPrice}"></div>
                </div>
                <button class="btn btn-primary w-100">Lọc</button>
                <a th:href="@{/cards}" class="btn btn-link w-100">Xóa bộ lọc</a>
            </form>
        </aside>

        <!-- Danh sách sản phẩm -->
        <main class="col-md-9">
            <p class="text-muted" th:text="${page.totalElements} + ' sản phẩm'"></p>
            <div class="alert alert-warning" th:if="${page.empty}">Không tìm thấy sản phẩm phù hợp.</div>

            <div class="row row-cols-2 row-cols-lg-3 g-3">
                <div class="col" th:each="p : ${page.content}">
                    <div class="card h-100 product-card">
                        <a th:href="@{/products/{id}(id=${p.id})}">
                            <img th:src="${p.image != null} ? ${p.image} : '/images/no-image.svg'"
                                 onerror="this.onerror=null; this.src='/images/no-image.svg'"
                                 class="card-img-top product-img" th:alt="${p.displayName}" loading="lazy">
                        </a>
                        <div class="card-body d-flex flex-column">
                            <h6 class="card-title">
                                <a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.displayName}"
                                   class="text-decoration-none text-dark"></a>
                            </h6>
                            <div class="mb-2">
                                <span class="badge bg-secondary" th:text="${p.productType}"></span>
                                <span class="badge bg-info text-dark" th:if="${p.cardCondition != null}"
                                      th:text="${p.cardCondition}"></span>
                            </div>
                            <p class="fw-bold mb-0"
                               th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></p>
                            <small th:class="${p.stock > 0} ? 'text-success' : 'text-danger'"
                                   th:text="${p.stock > 0} ? 'Còn ' + ${p.stock} : 'Hết hàng'"></small>

                            <!-- Thẻ lẻ: chọn tình trạng ở trang chi tiết -->
                            <a th:if="${p.single}" th:href="@{/products/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-primary w-100 mt-auto">Chọn tình trạng</a>

                            <!-- Hàng sealed: thêm vào giỏ ngay -->
                            <div th:unless="${p.single}" class="mt-auto pt-2">
                                <button th:if="${p.stock <= 0}" class="btn btn-sm btn-secondary w-100" disabled>
                                    Hết hàng</button>

                                <form th:if="${p.stock > 0}" sec:authorize="hasRole('CUSTOMER')"
                                      th:action="@{/cart/add}" method="post">
                                    <input type="hidden" name="productId" th:value="${p.id}">
                                    <input type="hidden" name="quantity" value="1">
                                    <button type="submit" class="btn btn-sm btn-primary w-100">Thêm vào giỏ</button>
                                </form>

                                <a th:if="${p.stock > 0}" sec:authorize="!isAuthenticated()" th:href="@{/login}"
                                   class="btn btn-sm btn-outline-primary w-100">Đăng nhập để mua</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Phân trang (giữ đủ bộ lọc khi chuyển trang) -->
            <nav class="mt-4" th:if="${page.totalPages > 1}">
                <ul class="pagination">
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                        th:classappend="${i == page.number} ? 'active'">
                        <a class="page-link"
                           th:href="@{/cards(page=${i}, keyword=${filter.keyword}, productType=${filter.productType},
                                     setId=${filter.setId}, color=${filter.color}, cardType=${filter.cardType},
                                     rarity=${filter.rarity}, cardCondition=${filter.cardCondition},
                                     minPrice=${filter.minPrice}, maxPrice=${filter.maxPrice})}"
                           th:text="${i + 1}"></a>
                    </li>
                </ul>
            </nav>
        </main>
    </div>
</div>
</body>
</html>
