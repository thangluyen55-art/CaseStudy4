<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Đơn hàng #' + ${order.id} + ' - DigiShop TCG'">Chi tiết đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>.item-img { width: 48px; aspect-ratio: 5 / 7; object-fit: contain; background: #070c18; }</style>
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container mb-5">
    <div th:replace="~{layout/layout :: alerts}"></div>
    <a th:href="@{/orders}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Quay lại danh sách đơn hàng</a>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold text-info mb-0" th:text="'Chi Tiết Đơn Hàng #' + ${order.id}"></h3>
        <span th:switch="${order.status.name()}" class="fs-6">
            <span th:case="'PENDING'" class="badge bg-warning text-dark">Chờ xác nhận</span>
            <span th:case="'CONFIRMED'" class="badge bg-info text-dark">Đã xác nhận</span>
            <span th:case="'PACKING'" class="badge bg-primary">Đang đóng gói</span>
            <span th:case="'SHIPPING'" class="badge bg-primary">Đang giao hàng</span>
            <span th:case="'COMPLETED'" class="badge bg-success">Hoàn tất</span>
            <span th:case="'CANCELLED'" class="badge bg-danger">Đã hủy</span>
        </span>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-3 mb-3">
                <h5 class="fw-bold text-light mb-3">Thông Tin Người Nhận</h5>
                <p class="mb-1"><span class="text-muted">Người nhận:</span> <span class="text-light" th:text="${order.receiverName}"></span></p>
                <p class="mb-1"><span class="text-muted">Điện thoại:</span> <span class="text-light" th:text="${order.phone}"></span></p>
                <p class="mb-1"><span class="text-muted">Địa chỉ:</span> <span class="text-light" th:text="${order.shippingAddress}"></span></p>
                <p class="mb-0"><span class="text-muted">Thanh toán:</span>
                    <span class="text-light" th:text="${order.paymentMethod == 'BANK_TRANSFER'} ? 'Chuyển khoản' : 'COD'"></span></p>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-3">
                <h5 class="fw-bold text-light mb-3">Sản Phẩm Đã Đặt</h5>
                <div class="table-responsive">
                    <table class="table table-dark align-middle mb-0">
                        <thead>
                        <tr class="table-light">
                            <th>Sản phẩm</th>
                            <th class="text-end">Đơn giá</th>
                            <th class="text-center">SL</th>
                            <th class="text-end">Thành tiền</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.items}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <img th:src="${item.product.image != null} ? ${item.product.image} : '/images/no-image.svg'"
                                         onerror="this.onerror=null; this.src='/images/no-image.svg'"
                                         class="item-img rounded" th:alt="${item.product.displayName}">
                                    <div>
                                        <div class="fw-bold text-light" th:text="${item.product.displayName}"></div>
                                        <small class="text-muted" th:if="${item.product.cardCondition != null}"
                                               th:text="'Tình trạng: ' + ${item.product.cardCondition}"></small>
                                    </div>
                                </div>
                            </td>
                            <td class="text-end"
                                th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                            <td class="text-center" th:text="${item.quantity}"></td>
                            <td class="text-end text-info"
                                th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-4 border-top border-secondary pt-3">
                    <div class="d-flex justify-content-between my-1">
                        <span class="text-muted">Tạm tính:</span>
                        <span th:text="${#numbers.formatDecimal(order.subtotal, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                    </div>
                    <div class="d-flex justify-content-between my-1">
                        <span class="text-muted">Phí vận chuyển:</span>
                        <span th:text="${#numbers.formatDecimal(order.shippingFee, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                    </div>
                    <div class="d-flex justify-content-between text-success my-1" th:if="${order.discount != null and order.discount.signum() > 0}">
                        <span>Giảm giá:</span>
                        <span th:text="'- ' + ${#numbers.formatDecimal(order.discount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                    </div>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between fs-5 fw-bold">
                        <span>Tổng cộng:</span>
                        <span class="price-text"
                              th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                    </div>
                </div>

                <form th:if="${order.status.name() == 'PENDING'}"
                      th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" class="mt-3"
                      onsubmit="return confirm('Bạn chắc chắn muốn hủy đơn hàng này?');">
                    <button type="submit" class="btn btn-outline-danger">Hủy Đơn Hàng</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/layout :: siteFooter}"></div>
</body>
</html>
