<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>404 Not Found - DigiShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="text-center">
    <h1 class="display-1 fw-bold text-info">404</h1>
    <h3 class="text-light mb-3">Không Tìm Thấy Trang</h3>
    <p class="text-muted mb-4" th:text="${error != null} ? ${error} : 'Trang bạn tìm kiếm không tồn tại hoặc đã bị dời đi.'"></p>
    <a th:href="@{/cards}" class="btn btn-digi px-4">Quay Về Cửa Hàng</a>
</div>
</body>
</html>
