<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thống kê - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5">
    <h3 class="mb-3">Thống kê</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
            <div class="text-muted small">Doanh thu (đơn hoàn tất)</div>
            <div class="fs-5 fw-bold text-success"
                 th:text="${#numbers.formatDecimal(d.revenue, 0, 'POINT', 0, 'COMMA')} + ' đ'"></div>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
            <div class="text-muted small">Tổng số đơn</div>
            <div class="fs-5 fw-bold" th:text="${d.totalOrders}"></div>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
            <div class="text-muted small">Đơn chờ xác nhận</div>
            <div class="fs-5 fw-bold text-warning" th:text="${d.pendingOrders}"></div>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
            <div class="text-muted small">Sản phẩm / Khách hàng</div>
            <div class="fs-5 fw-bold" th:text="${d.productCount} + ' / ' + ${d.customerCount}"></div>
        </div></div></div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header fw-bold">Doanh thu theo tháng (đơn hoàn tất)</div>
                <div class="card-body">
                    <p class="text-muted" th:if="${d.months.isEmpty()}">Chưa có đơn hoàn tất nào.</p>
                    <div class="mb-3" th:each="m : ${d.months}">
                        <div class="d-flex justify-content-between small">
                            <span th:text="${m.label}"></span>
                            <span th:text="${#numbers.formatDecimal(m.amount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                        </div>
                        <div class="progress" style="height: 10px;">
                            <div class="progress-bar bg-success" th:style="'width:' + ${m.percent} + '%'"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header fw-bold">Đơn hàng theo trạng thái</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between" th:each="s : ${d.byStatus}">
                        <a th:href="@{/admin/orders(status=${s.status})}" th:text="${s.status}"
                           class="text-decoration-none"></a>
                        <span class="badge bg-secondary" th:text="${s.count}"></span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header fw-bold">Sản phẩm bán chạy</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item text-muted" th:if="${d.top.isEmpty()}">Chưa có dữ liệu.</li>
                    <li class="list-group-item d-flex justify-content-between" th:each="t : ${d.top}">
                        <span th:text="${t.name}"></span>
                        <span class="badge bg-primary" th:text="${t.quantity}"></span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header fw-bold">Sắp hết hàng (còn từ 2 trở xuống)</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item text-muted" th:if="${d.lowStock.isEmpty()}">Không có sản phẩm nào.</li>
                    <li class="list-group-item d-flex justify-content-between align-items-center"
                        th:each="p : ${d.lowStock}">
                        <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" th:text="${p.displayName}"
                           class="text-decoration-none"></a>
                        <span class="badge" th:classappend="${p.stock == 0} ? 'bg-danger' : 'bg-warning text-dark'"
                              th:text="${p.stock}"></span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
