<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thống kê - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5">
    <h3 class="fw-bold text-info mb-4">Thống Kê Doanh Thu & Hệ Thống</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="card p-3"><div class="text-muted small">Doanh thu (hoàn tất)</div><div class="fs-4 fw-bold text-success" th:text="${#numbers.formatDecimal(d.revenue, 0, 'POINT', 0, 'COMMA')} + ' đ'"></div></div></div>
        <div class="col-6 col-lg-3"><div class="card p-3"><div class="text-muted small">Tổng số đơn</div><div class="fs-4 fw-bold text-light" th:text="${d.totalOrders}"></div></div></div>
        <div class="col-6 col-lg-3"><div class="card p-3"><div class="text-muted small">Đơn chờ xác nhận</div><div class="fs-4 fw-bold text-warning" th:text="${d.pendingOrders}"></div></div></div>
        <div class="col-6 col-lg-3"><div class="card p-3"><div class="text-muted small">Sản phẩm / Khách hàng</div><div class="fs-4 fw-bold text-info" th:text="${d.productCount} + ' / ' + ${d.customerCount}"></div></div></div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card p-4 h-100">
                <h5 class="fw-bold text-light mb-3">Doanh Thu Theo Tháng</h5>
                <div class="mb-3" th:each="m : ${d.months}">
                    <div class="d-flex justify-content-between small text-light mb-1">
                        <span th:text="${m.label}"></span>
                        <span th:text="${#numbers.formatDecimal(m.amount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                    </div>
                    <div class="progress bg-dark" style="height: 10px;">
                        <div class="progress-bar bg-success" th:style="'width:' + ${m.percent} + '%'"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card p-4 h-100">
                <h5 class="fw-bold text-light mb-3">Sản Phẩm Bán Chạy</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between" th:each="t : ${d.top}">
                        <span th:text="${t.name}"></span>
                        <span class="badge bg-info text-dark" th:text="${t.quantity} + ' sp'"></span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/layout :: siteFooter}"></div>
</body>
</html>
