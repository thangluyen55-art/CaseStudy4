<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Sửa sản phẩm - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5" style="max-width: 720px;">
    <div th:replace="~{layout/layout :: alerts}"></div>
    <a th:href="@{/admin/products}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Quay lại danh sách</a>
    <h3 class="fw-bold text-info mb-4" th:text="'Sửa Sản Phẩm #' + ${product.id}"></h3>

    <div class="card p-4">
        <form th:action="@{/admin/products/{id}(id=${product.id})}" method="post">
            <div class="mb-3" th:unless="${product.single}">
                <label class="form-label" for="name">Tên sản phẩm</label>
                <input type="text" name="name" class="form-control" th:value="${product.name}">
            </div>
            <div th:if="${product.single and product.card != null}" class="border border-secondary rounded p-3 mb-3">
                <h5 class="text-info mb-3">Thông tin Digimon</h5>
                <div class="mb-3">
                    <label class="form-label" for="digimonForm">Digimon Form</label>
                    <input id="digimonForm" type="text" name="digimonForm" class="form-control"
                           placeholder="Ví dụ: Mega" th:value="${product.card.digimonForm}">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="digimonAttribute">Digimon Attribute</label>
                    <input id="digimonAttribute" type="text" name="digimonAttribute" class="form-control"
                           placeholder="Ví dụ: Data" th:value="${product.card.digimonAttribute}">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="digimonType">Digimon Type</label>
                    <input id="digimonType" type="text" name="digimonType" class="form-control"
                           placeholder="Ví dụ: Holy Warrior/Royal Knight" th:value="${product.card.digimonType}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="price">Giá bán (VNĐ)</label>
                <input type="number" name="price" class="form-control" min="1" required th:value="${product.price.toBigInteger()}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="stock">Tồn kho</label>
                <input type="number" name="stock" class="form-control" min="0" required th:value="${product.stock}">
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" name="active" value="true" id="active" th:checked="${product.active}">
                <label class="form-check-label text-light" for="active">Hiển thị trên cửa hàng</label>
            </div>
            <button type="submit" class="btn btn-digi py-2 px-4">Lưu Thay Đổi</button>
        </form>
    </div>
</div>
<div th:replace="~{layout/layout :: siteFooter}"></div>
</body>
</html>
