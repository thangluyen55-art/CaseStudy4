<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa sản phẩm - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5" style="max-width: 720px;">
    <div th:replace="~{layout/layout :: alerts}"></div>
    <a th:href="@{/admin/products}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Quay lại danh sách</a>
    <h3 class="fw-bold text-info mb-4" th:text="'Sửa Sản Phẩm #' + ${product.id}"></h3>

    <div class="card p-4">
        <form th:action="@{/admin/products/{id}(id=${product.id})}" method="post">
            <div class="mb-3" th:unless="${product.single}">
                <label class="form-label">Tên sản phẩm</label>
                <input type="text" name="name" class="form-control" th:value="${product.name}">
            </div>
            <div class="mb-3">
                <label class="form-label">Giá bán (VNĐ)</label>
                <input type="number" name="price" class="form-control" min="1" required th:value="${product.price.toBigInteger()}">
            </div>
            <div class="mb-3">
                <label class="form-label">Tồn kho</label>
                <input type="number" name="stock" class="form-control" min="0" required th:value="${product.stock}">
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" name="active" value="true" id="active" th:checked="${product.active}">
                <label class="form-check-label text-light" for="active">Hiển thị trên cửa hàng</label>
            </div>
            <button type="submit" class="btn btn-digi py-2 px-4">Lưu Thay Đổi</button>
        </form>
    </div>
</div>
</body>
</html>
