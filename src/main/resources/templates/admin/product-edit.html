<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sửa sản phẩm - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5" style="max-width: 760px;">
    <div th:replace="~{layout/layout :: alerts}"></div>
    <a th:href="@{/admin/products}" class="btn btn-link mb-2">&larr; Danh sách sản phẩm</a>
    <h3 class="mb-3" th:text="'Sửa sản phẩm #' + ${product.id}"></h3>

    <div class="row g-4">
        <div class="col-md-4">
            <img class="img-fluid rounded" th:src="${product.image != null} ? ${product.image} : '/images/no-image.svg'"
                 onerror="this.onerror=null; this.src='/images/no-image.svg'" alt="">
            <p class="mt-2 mb-0 fw-bold" th:text="${product.displayName}"></p>
            <span class="badge bg-secondary" th:text="${product.productType}"></span>
            <span class="badge bg-info text-dark" th:if="${product.cardCondition != null}"
                  th:text="${product.cardCondition}"></span>
        </div>

        <div class="col-md-8">
            <form th:action="@{/admin/products/{id}(id=${product.id})}" method="post" class="card card-body mb-3">
                <div class="mb-3" th:unless="${product.single}">
                    <label class="form-label">Tên sản phẩm</label>
                    <input type="text" name="name" class="form-control" th:value="${product.name}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Giá (đ)</label>
                    <input type="number" name="price" class="form-control" min="1" step="1" required
                           th:value="${product.price.toBigInteger()}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Tồn kho</label>
                    <input type="number" name="stock" class="form-control" min="0" required th:value="${product.stock}">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="active" value="true" id="active"
                           th:checked="${product.active}">
                    <label class="form-check-label" for="active">Hiển thị trên cửa hàng</label>
                </div>
                <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
            </form>

            <!-- Ảnh: chỉ cho hàng sealed -->
            <form th:unless="${product.single}" th:action="@{/admin/products/{id}/image(id=${product.id})}"
                  method="post" enctype="multipart/form-data" class="card card-body">
                <label class="form-label">Ảnh sản phẩm (PNG, JPG, WEBP, tối đa 5 MB)</label>
                <input type="file" name="file" class="form-control mb-3" accept="image/png,image/jpeg,image/webp" required>
                <button type="submit" class="btn btn-outline-primary">Tải ảnh lên</button>
            </form>
            <p class="text-muted small" th:if="${product.single}">
                Ảnh thẻ lẻ lấy theo mã thẻ trong thư mục ảnh (D:/Image/digimon).</p>
        </div>
    </div>
</div>
</body>
</html>
