<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.thumb { width: 40px; aspect-ratio: 5 / 7; object-fit: contain; background: #f8f9fa; }</style>
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5">
    <h3 class="mb-3">Quản lý sản phẩm</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <form method="get" th:action="@{/admin/products}" class="d-flex gap-2 mb-3" style="max-width: 460px;">
        <input type="text" name="keyword" class="form-control" th:value="${keyword}"
               placeholder="Tên sản phẩm hoặc mã thẻ">
        <button class="btn btn-primary">Tìm</button>
        <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Xóa</a>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th></th><th>ID</th><th>Sản phẩm</th><th>Loại</th><th class="text-end">Giá</th>
                    <th class="text-center">Tồn</th><th>Hiển thị</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${page.content}" th:classappend="${!p.active} ? 'table-secondary'">
                    <td><img class="thumb rounded" th:src="${p.image != null} ? ${p.image} : '/images/no-image.svg'"
                             onerror="this.onerror=null; this.src='/images/no-image.svg'" alt=""></td>
                    <td th:text="${p.id}"></td>
                    <td>
                        <span th:text="${p.displayName}"></span>
                        <span class="badge bg-info text-dark" th:if="${p.cardCondition != null}"
                              th:text="${p.cardCondition}"></span>
                    </td>
                    <td><span class="badge bg-secondary" th:text="${p.productType}"></span></td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                    <td class="text-center">
                        <span class="badge" th:classappend="${p.stock == 0} ? 'bg-danger' : (${p.stock <= 2} ? 'bg-warning text-dark' : 'bg-success')"
                              th:text="${p.stock}"></span>
                    </td>
                    <td th:text="${p.active} ? 'Đang bán' : 'Đã ẩn'"></td>
                    <td><a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-primary">Sửa</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${page.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/products(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
