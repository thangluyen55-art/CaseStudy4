<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>.thumb { width: 40px; aspect-ratio: 5 / 7; object-fit: contain; background: #070c18; }</style>
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5">
    <h3 class="fw-bold text-info mb-4">Quản Lý Sản Phẩm</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-dark align-middle mb-0">
                <thead>
                <tr class="table-light">
                    <th>Ảnh</th>
                    <th>ID</th>
                    <th>Tên Sản Phẩm</th>
                    <th>Giá</th>
                    <th>Tồn Kho</th>
                    <th>Trạng Thái</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${page.content}">
                    <td><img class="thumb rounded" th:src="${p.image != null} ? ${p.image} : '/images/no-image.svg'"
                             onerror="this.onerror=null; this.src='/images/no-image.svg'" alt=""></td>
                    <td th:text="${p.id}"></td>
                    <td class="fw-bold text-light" th:text="${p.displayName}"></td>
                    <td class="price-text" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                    <td th:text="${p.stock}"></td>
                    <td th:text="${p.active} ? 'Đang bán' : 'Ẩn'"></td>
                    <td><a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-info">Sửa</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{layout/layout :: siteFooter}"></div>
</body>
</html>
