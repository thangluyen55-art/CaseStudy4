<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý đơn hàng - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5">
    <h3 class="mb-3">Quản lý đơn hàng</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="mb-3 d-flex flex-wrap gap-2">
        <a th:href="@{/admin/orders}" class="btn btn-sm"
           th:classappend="${status == null} ? 'btn-dark' : 'btn-outline-dark'">Tất cả</a>
        <a th:each="s : ${statuses}" th:href="@{/admin/orders(status=${s})}" th:text="${s}"
           class="btn btn-sm" th:classappend="${s == status} ? 'btn-dark' : 'btn-outline-dark'"></a>
    </div>

    <div class="alert alert-info" th:if="${page.empty}">Không có đơn hàng nào.</div>

    <div class="card" th:unless="${page.empty}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã đơn</th>
                    <th>Ngày đặt</th>
                    <th>Khách hàng</th>
                    <th class="text-end">Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${page.content}">
                    <td th:text="'#' + ${o.id}"></td>
                    <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <div th:text="${o.receiverName}"></div>
                        <small class="text-muted" th:text="${o.user.email}"></small>
                    </td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                    <td><span class="badge bg-secondary" th:text="${o.status}"></span></td>
                    <td><a th:href="@{/admin/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary">Xử lý</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${page.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/orders(page=${i}, status=${status})}" th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
