<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý đơn hàng - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5">
    <h3 class="fw-bold text-info mb-4">Quản Lý Đơn Hàng</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-dark align-middle mb-0">
                <thead>
                <tr class="table-light">
                    <th>Mã Đơn</th>
                    <th>Ngày Đặt</th>
                    <th>Tổng Tiền</th>
                    <th>Trạng Thái</th>
                    <th>Hành Động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${page.content}">
                    <td class="fw-bold text-info" th:text="'#' + ${o.id}"></td>
                    <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="price-text" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                    <td th:text="${o.status}"></td>
                    <td><a th:href="@{/admin/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-info">Chi Tiết</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{layout/layout :: siteFooter}"></div>
</body>
</html>
