<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Coupon - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5">
    <h3 class="fw-bold text-info mb-4">Quản Lý Mã Giảm Giá</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-dark align-middle mb-0">
                <thead>
                <tr class="table-light">
                    <th>Mã</th>
                    <th>Giảm</th>
                    <th>Đơn Tối Thiểu</th>
                    <th>Đã Dùng</th>
                    <th>Hạn Dùng</th>
                    <th>Trạng Thái</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${coupons}">
                    <td class="fw-bold text-info" th:text="${c.code}"></td>
                    <td th:text="${c.discountType.name() == 'PERCENT'} ? ${c.discountValue.toBigInteger()} + '%' : ${#numbers.formatDecimal(c.discountValue, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                    <td th:text="${c.minOrderValue != null} ? ${#numbers.formatDecimal(c.minOrderValue, 0, 'POINT', 0, 'COMMA')} + ' đ' : '-'"></td>
                    <td th:text="${c.usedCount} + (${c.usageLimit != null} ? ' / ' + ${c.usageLimit} : '')"></td>
                    <td th:text="${c.expiresAt != null} ? ${#temporals.format(c.expiresAt, 'dd/MM/yyyy')} : 'Không'"></td>
                    <td th:text="${c.active} ? 'Bật' : 'Tắt'"></td>
                    <td>
                        <form th:action="@{/admin/coupons/{id}/toggle(id=${c.id})}" method="post">
                            <button class="btn btn-sm btn-outline-secondary" th:text="${c.active} ? 'Tắt' : 'Bật'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
