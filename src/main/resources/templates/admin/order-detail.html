<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Đơn #' + ${order.id} + ' - DigiShop Admin'">Chi tiết đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5">
    <div th:replace="~{layout/layout :: alerts}"></div>
    <a th:href="@{/admin/orders}" class="btn btn-link mb-2">&larr; Danh sách đơn hàng</a>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
        <h3 class="mb-0" th:text="'Đơn hàng #' + ${order.id}"></h3>
        <span class="badge bg-dark fs-6" th:text="${order.status}"></span>
    </div>
    <p class="text-muted" th:text="'Ngày đặt: ' + ${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></p>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-header fw-bold">Khách hàng</div>
                <div class="card-body">
                    <p class="mb-1"><span class="text-muted">Tài khoản:</span> <span th:text="${order.user.email}"></span></p>
                    <p class="mb-1"><span class="text-muted">Người nhận:</span> <span th:text="${order.receiverName}"></span></p>
                    <p class="mb-1"><span class="text-muted">Điện thoại:</span> <span th:text="${order.phone}"></span></p>
                    <p class="mb-1"><span class="text-muted">Địa chỉ:</span> <span th:text="${order.shippingAddress}"></span></p>
                    <p class="mb-0"><span class="text-muted">Thanh toán:</span>
                        <span th:text="${order.paymentMethod == 'BANK_TRANSFER'} ? 'Chuyển khoản' : 'COD'"></span></p>
                </div>
            </div>

            <div class="card">
                <div class="card-header fw-bold">Cập nhật trạng thái</div>
                <div class="card-body">
                    <p class="text-muted mb-0" th:if="${nextStatuses.isEmpty()}">
                        Đơn đã ở trạng thái cuối, không thể thay đổi.</p>
                    <form th:each="s : ${nextStatuses}" th:action="@{/admin/orders/{id}/status(id=${order.id})}"
                          method="post" class="mb-2"
                          th:onsubmit="${s.name() == 'CANCELLED'} ? 'return confirm(\'Hủy đơn và hoàn lại tồn kho?\');' : null">
                        <input type="hidden" name="status" th:value="${s}">
                        <button type="submit" class="btn w-100"
                                th:classappend="${s.name() == 'CANCELLED'} ? 'btn-outline-danger' : 'btn-primary'"
                                th:text="'Chuyển sang ' + ${s}"></button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header fw-bold">Sản phẩm</div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr><th>Sản phẩm</th><th class="text-end">Đơn giá</th><th class="text-center">SL</th>
                            <th class="text-end">Thành tiền</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.items}">
                            <td>
                                <span th:text="${item.product.displayName}"></span>
                                <div class="small text-muted" th:if="${item.product.cardCondition != null}"
                                     th:text="'Tình trạng: ' + ${item.product.cardCondition}"></div>
                            </td>
                            <td class="text-end"
                                th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                            <td class="text-center" th:text="${item.quantity}"></td>
                            <td class="text-end"
                                th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card mt-3"><div class="card-body">
                <div class="d-flex justify-content-between"><span>Tạm tính</span>
                    <span th:text="${#numbers.formatDecimal(order.subtotal, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span></div>
                <div class="d-flex justify-content-between"><span>Phí vận chuyển</span>
                    <span th:text="${#numbers.formatDecimal(order.shippingFee, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span></div>
                <hr>
                <div class="d-flex justify-content-between fs-5 fw-bold"><span>Tổng cộng</span>
                    <span class="text-danger"
                          th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span></div>
            </div></div>
        </div>
    </div>
</div>
</body>
</html>
