<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Chi tiết đơn hàng - DigiShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/admin-layout :: adminNav}"></div>

<div class="container mb-5">
    <div th:replace="~{layout/layout :: alerts}"></div>
    <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Danh sách đơn hàng</a>

    <h3 class="fw-bold text-info mb-4" th:text="'Chi Tiết Đơn Hàng #' + ${order.id}"></h3>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-3">
                <h5 class="fw-bold text-light mb-3">Thông Tin Đơn Hàng</h5>
                <p class="mb-1"><span class="text-muted">Khách hàng:</span> <span class="text-light" th:text="${order.user.email}"></span></p>
                <p class="mb-1"><span class="text-muted">Người nhận:</span> <span class="text-light" th:text="${order.receiverName}"></span></p>
                <p class="mb-1"><span class="text-muted">SĐT:</span> <span class="text-light" th:text="${order.phone}"></span></p>
                <p class="mb-0"><span class="text-muted">Địa chỉ:</span> <span class="text-light" th:text="${order.shippingAddress}"></span></p>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card p-3">
                <h5 class="fw-bold text-light mb-3">Sản Phẩm</h5>
                <table class="table table-dark align-middle mb-0">
                    <thead>
                    <tr class="table-light"><th>Tên</th><th class="text-end">Đơn giá</th><th class="text-center">SL</th><th class="text-end">Thành tiền</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${order.items}">
                        <td class="fw-bold text-light" th:text="${item.product.displayName}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                        <td class="text-center" th:text="${item.quantity}"></td>
                        <td class="text-end text-info" th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/layout :: siteFooter}"></div>
</body>
</html>
