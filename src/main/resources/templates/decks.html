<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bộ bài của tôi - DigiShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container mb-5">
    <h3 class="mb-3">Bộ bài của tôi</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <form th:action="@{/decks}" method="post" class="d-flex gap-2 mb-4" style="max-width: 460px;">
        <input type="text" name="name" class="form-control" placeholder="Tên bộ bài mới" maxlength="100">
        <button class="btn btn-primary text-nowrap">Tạo bộ bài</button>
    </form>

    <div class="alert alert-info" th:if="${decks.isEmpty()}">Bạn chưa có bộ bài nào.</div>

    <div class="card" th:unless="${decks.isEmpty()}">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr><th>Tên</th><th>Bộ bài chính</th><th>Digi-Egg</th><th>Trạng thái</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="d : ${decks}">
                    <td th:text="${d.name}"></td>
                    <td th:text="${d.mainCount} + ' / 50'"></td>
                    <td th:text="${d.eggCount} + ' / 5'"></td>
                    <td>
                        <span class="badge bg-success" th:if="${d.valid}">Hợp lệ</span>
                        <span class="badge bg-warning text-dark" th:unless="${d.valid}">Chưa hợp lệ</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/decks/{id}(id=${d.id})}" class="btn btn-sm btn-primary">Mở</a>
                        <form th:action="@{/decks/{id}/delete(id=${d.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa bộ bài này?');">
                            <button class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
