<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bộ bài của tôi - DigiShop TCG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container mb-5">
    <h3 class="fw-bold text-info mb-4">Bộ Bài Của Tôi</h3>
    <div th:replace="~{layout/layout :: alerts}"></div>

    <form th:action="@{/decks}" method="post" class="d-flex gap-2 mb-4" style="max-width: 480px;">
        <input type="text" name="name" class="form-control" placeholder="Tên bộ bài mới" maxlength="100" required>
        <button class="btn btn-digi text-nowrap">+ Tạo Bộ Bài</button>
    </form>

    <div class="alert alert-dark border-secondary text-center py-4" th:if="${decks.isEmpty()}">
        Bạn chưa có bộ bài nào. Hãy tạo mới ở trên!
    </div>

    <div class="card p-3" th:unless="${decks.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-dark align-middle mb-0">
                <thead>
                <tr class="table-light">
                    <th>Tên Bộ Bài</th>
                    <th>Thẻ Chính</th>
                    <th>Digi-Egg</th>
                    <th>Trạng Thái</th>
                    <th class="text-end">Hành Động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="d : ${decks}">
                    <td class="fw-bold text-light" th:text="${d.name}"></td>
                    <td th:text="${d.mainCount} + ' / 50'"></td>
                    <td th:text="${d.eggCount} + ' / 5'"></td>
                    <td>
                        <span class="badge bg-success" th:if="${d.valid}">Hợp lệ</span>
                        <span class="badge bg-warning text-dark" th:unless="${d.valid}">Chưa hợp lệ</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/decks/{id}(id=${d.id})}" class="btn btn-sm btn-digi me-1">Mở Xây Dựng</a>
                        <form th:action="@{/decks/{id}/delete(id=${d.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa bộ bài này?');">
                            <button class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{layout/layout :: siteFooter}"></div>
</body>
</html>
