<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - DigiShop TCG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
<div class="container" style="max-width: 420px;">
    <h3 class="text-center fw-bold mb-4">
        <a th:href="@{/cards}" class="navbar-brand fs-2">DIGISHOP TCG</a>
    </h3>

    <div class="card p-4 shadow-lg">
        <h5 class="fw-bold text-info mb-3">Đăng Nhập</h5>

        <div class="alert alert-danger border-0 bg-danger text-white py-2" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div>
        <div class="alert alert-success border-0 bg-success text-white py-2" th:if="${message != null}" th:text="${message}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Email</label>
                <input type="email" name="username" class="form-control" required autofocus placeholder="name@domain.com">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Mật khẩu</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-digi w-100 py-2 mt-2">Đăng Nhập</button>
        </form>
        <p class="text-center text-muted mt-3 mb-0 small">Chưa có tài khoản? <a th:href="@{/register}" class="text-info">Đăng ký ngay</a></p>
    </div>
</div>
</body>
</html>
