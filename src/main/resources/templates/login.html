<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - DigiShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 440px;">
    <h3 class="text-center my-4"><a th:href="@{/cards}" class="text-decoration-none text-dark">DigiShop</a></h3>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="mb-3">Đăng nhập</h5>

            <div class="alert alert-danger" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div>
            <div class="alert alert-success" th:if="${message != null}" th:text="${message}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            </form>
            <p class="text-center mt-3 mb-0">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
        </div>
    </div>
</div>
</body>
</html>
