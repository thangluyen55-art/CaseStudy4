<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${deck.name} + ' - DigiShop TCG'">Xây dựng bộ bài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .thumb { width: 36px; aspect-ratio: 5 / 7; object-fit: contain; background: #070c18; }
        .deck-img { aspect-ratio: 5 / 7; object-fit: contain; background: #070c18; }
    </style>
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container mb-5">
    <div th:replace="~{layout/layout :: alerts}"></div>
    <a th:href="@{/decks}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Danh sách bộ bài</a>

    <div class="row g-4">
        <!-- Bộ bài đang xây -->
        <div class="col-lg-6">
            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold text-info mb-0" th:text="${deck.name}"></h5>
                    <span class="badge bg-success" th:if="${deck.valid}">Hợp lệ</span>
                    <span class="badge bg-warning text-dark" th:unless="${deck.valid}">Chưa đủ lá</span>
                </div>

                <div class="mb-3">
                    <div class="small d-flex justify-content-between text-muted mb-1">
                        <span>Bộ bài chính (Main Deck)</span><span th:text="${deck.mainCount} + ' / 50'"></span></div>
                    <div class="progress bg-dark mb-2" style="height: 8px;">
                        <div class="progress-bar bg-info" th:style="'width:' + ${deck.mainCount * 2} + '%'"></div>
                    </div>
                    <div class="small d-flex justify-content-between text-muted mb-1">
                        <span>Digi-Egg Deck</span><span th:text="${deck.eggCount} + ' / 5'"></span></div>
                    <div class="progress bg-dark" style="height: 8px;">
                        <div class="progress-bar bg-warning" th:style="'width:' + ${deck.eggCount * 20} + '%'"></div>
                    </div>
                </div>

                <p class="text-muted small" th:if="${deck.cards.isEmpty()}">Chưa có thẻ nào trong bộ bài. Hãy tìm ở danh sách bên phải.</p>

                <div class="table-responsive mb-3" th:unless="${deck.cards.isEmpty()}">
                    <table class="table table-dark align-middle mb-0">
                        <tbody>
                        <tr th:each="dc : ${deck.cards}">
                            <td style="width: 44px;">
                                <img class="thumb rounded" th:src="'/card-images/' + ${dc.card.cardCode} + '.webp'"
                                     onerror="this.onerror=null; this.src='/images/no-image.svg'" alt="">
                            </td>
                            <td>
                                <div class="fw-bold text-light" th:text="${dc.card.name}"></div>
                                <small class="text-muted" th:text="${dc.card.cardCode} + ' - ' + ${dc.card.cardType}"></small>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/decks/{id}/remove(id=${deck.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="cardId" th:value="${dc.card.id}">
                                    <input type="hidden" name="q" th:value="${q}">
                                    <button class="btn btn-sm btn-outline-secondary py-0 px-2">-</button>
                                </form>
                                <span class="mx-2 fw-bold text-info" th:text="${dc.quantity}"></span>
                                <form th:action="@{/decks/{id}/add(id=${deck.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="cardId" th:value="${dc.card.id}">
                                    <input type="hidden" name="q" th:value="${q}">
                                    <button class="btn btn-sm btn-outline-secondary py-0 px-2">+</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <form th:action="@{/decks/{id}/to-cart(id=${deck.id})}" method="post">
                    <button class="btn btn-digi w-100" th:disabled="${deck.cards.isEmpty()}">🛒 Mua Cả Bộ Bài Này</button>
                </form>
            </div>
        </div>

        <!-- Tìm & thêm thẻ -->
        <div class="col-lg-6">
            <div class="card p-3 mb-3">
                <form th:action="@{/decks/{id}(id=${deck.id})}" method="get" class="d-flex gap-2">
                    <input type="text" name="q" class="form-control" th:value="${q}" placeholder="Tìm theo tên hoặc mã thẻ...">
                    <button class="btn btn-outline-info">Tìm</button>
                </form>
            </div>

            <p class="text-muted" th:if="${results.isEmpty()}">Không tìm thấy thẻ bài phù hợp.</p>
            <div class="row row-cols-2 row-cols-md-3 g-2">
                <div class="col" th:each="c : ${results}">
                    <div class="tcg-card h-100 p-2 d-flex flex-column">
                        <img class="deck-img rounded mb-2" th:src="'/card-images/' + ${c.cardCode} + '.webp'"
                             onerror="this.onerror=null; this.src='/images/no-image.svg'" th:alt="${c.name}" loading="lazy">
                        <div class="small fw-bold text-light text-truncate" th:text="${c.name}"></div>
                        <div class="small text-muted mb-2" th:text="${c.cardCode}"></div>
                        <form th:action="@{/decks/{id}/add(id=${deck.id})}" method="post" class="mt-auto">
                            <input type="hidden" name="cardId" th:value="${c.id}">
                            <input type="hidden" name="q" th:value="${q}">
                            <button class="btn btn-sm btn-digi w-100">+ Thêm</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
