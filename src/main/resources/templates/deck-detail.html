<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${deck.name} + ' - DigiShop'">Bộ bài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .thumb { width: 36px; aspect-ratio: 5 / 7; object-fit: contain; background: #f8f9fa; }
        .deck-img { aspect-ratio: 5 / 7; object-fit: contain; background: #f8f9fa; }
    </style>
</head>
<body>
<div th:replace="~{layout/layout :: navbar}"></div>

<div class="container mb-5">
    <div th:replace="~{layout/layout :: alerts}"></div>
    <a th:href="@{/decks}" class="btn btn-link mb-2">&larr; Danh sách bộ bài</a>

    <div class="row g-4">
        <!-- Bộ bài đang xây -->
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="fw-bold" th:text="${deck.name}"></span>
                    <span class="badge bg-success" th:if="${deck.valid}">Hợp lệ</span>
                    <span class="badge bg-warning text-dark" th:unless="${deck.valid}">Chưa hợp lệ</span>
                </div>
                <div class="card-body">
                    <div class="small d-flex justify-content-between">
                        <span>Bộ bài chính</span><span th:text="${deck.mainCount} + ' / 50'"></span></div>
                    <div class="progress mb-2" style="height: 8px;">
                        <div class="progress-bar" th:classappend="${deck.mainCount == 50} ? 'bg-success'"
                             th:style="'width:' + ${deck.mainCount * 2} + '%'"></div>
                    </div>
                    <div class="small d-flex justify-content-between">
                        <span>Digi-Egg</span><span th:text="${deck.eggCount} + ' / 5'"></span></div>
                    <div class="progress" style="height: 8px;">
                        <div class="progress-bar bg-info" th:style="'width:' + ${deck.eggCount * 20} + '%'"></div>
                    </div>
                    <p class="small text-muted mt-2 mb-0">
                        Luật: bộ bài chính đúng 50 lá, mỗi thẻ tối đa 4 bản, tối đa 5 Digi-Egg.</p>
                </div>

                <p class="text-muted px-3" th:if="${deck.cards.isEmpty()}">Chưa có thẻ nào. Hãy tìm và thêm thẻ ở bên phải.</p>

                <div class="table-responsive" th:unless="${deck.cards.isEmpty()}">
                    <table class="table table-sm align-middle mb-0">
                        <tbody>
                        <tr th:each="dc : ${deck.cards}">
                            <td style="width: 52px;">
                                <img class="thumb rounded" th:src="'/card-images/' + ${dc.card.cardCode} + '.webp'"
                                     onerror="this.onerror=null; this.src='/images/no-image.svg'" alt="">
                            </td>
                            <td>
                                <div th:text="${dc.card.name}"></div>
                                <small class="text-muted" th:text="${dc.card.cardCode} + ' - ' + ${dc.card.cardType}"></small>
                            </td>
                            <td class="text-nowrap text-end">
                                <form th:action="@{/decks/{id}/remove(id=${deck.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="cardId" th:value="${dc.card.id}">
                                    <input type="hidden" name="q" th:value="${q}">
                                    <button class="btn btn-sm btn-outline-secondary">-</button>
                                </form>
                                <span class="mx-2 fw-bold" th:text="${dc.quantity}"></span>
                                <form th:action="@{/decks/{id}/add(id=${deck.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="cardId" th:value="${dc.card.id}">
                                    <input type="hidden" name="q" th:value="${q}">
                                    <button class="btn btn-sm btn-outline-secondary">+</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="card-footer d-flex gap-2">
                    <form th:action="@{/decks/{id}/to-cart(id=${deck.id})}" method="post">
                        <button class="btn btn-primary" th:disabled="${deck.cards.isEmpty()}">Thêm cả bộ vào giỏ</button>
                    </form>
                </div>
            </div>
            <p class="small text-muted mt-2">
                Mỗi thẻ được thêm vào giỏ theo bản tình trạng tốt nhất còn hàng.</p>
        </div>

        <!-- Tìm thẻ -->
        <div class="col-lg-6">
            <form th:action="@{/decks/{id}(id=${deck.id})}" method="get" class="d-flex gap-2 mb-3">
                <input type="text" name="q" class="form-control" th:value="${q}" placeholder="Tìm theo tên hoặc mã thẻ">
                <button class="btn btn-primary">Tìm</button>
            </form>

            <p class="text-muted" th:if="${results.isEmpty()}">Không tìm thấy thẻ phù hợp.</p>
            <div class="row row-cols-2 row-cols-md-3 g-2">
                <div class="col" th:each="c : ${results}">
                    <div class="card h-100">
                        <img class="card-img-top deck-img" th:src="'/card-images/' + ${c.cardCode} + '.webp'"
                             onerror="this.onerror=null; this.src='/images/no-image.svg'" th:alt="${c.name}" loading="lazy">
                        <div class="card-body p-2 d-flex flex-column">
                            <div class="small fw-bold" th:text="${c.name}"></div>
                            <div class="small text-muted mb-2" th:text="${c.cardCode}"></div>
                            <form th:action="@{/decks/{id}/add(id=${deck.id})}" method="post" class="mt-auto">
                                <input type="hidden" name="cardId" th:value="${c.id}">
                                <input type="hidden" name="q" th:value="${q}">
                                <button class="btn btn-sm btn-primary w-100">+ Thêm</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
